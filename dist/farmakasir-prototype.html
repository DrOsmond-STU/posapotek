        ${id !== "semua" && id !== "Reguler" ? `<div style="padding:0 20px 12px">${alert("warn", jenisOf(id).ic, `Ketentuan SP ${id}`, jenisOf(id).rule)}</div>` : ""}
        ${table({ columns: cols, rows, empty: "Belum ada SP untuk jenis ini" })}</div>`;
      return `
      ${UI.pageHeader({
        title: "Surat Pesanan (SP)",
        sub: "Pemesanan ke PBF dengan formulir terpisah untuk reguler, narkotika, psikotropika, prekursor, dan OOT — lengkap dengan tanda tangan digital Apoteker PJ.",
        crumbs: ["Pembelian", "Surat Pesanan"],
        actions: `${btn("Buat SP", "success", { icon: "add", attrs: "data-sp-new" })}${btn("Saran Pemesanan", "white", { icon: "auto_awesome", attrs: 'data-go="stok"' })}${btn("Excel", "teal", { icon: "table_view", attrs: 'data-toast="Daftar SP diekspor ke Excel (.xlsx)"' })}`,
      })}

      <div class="grid g-4">
        ${stat({ label: "SP bulan ini", value: num(bulan.length), icon: "shopping_cart_checkout", tone: "primary", hero: true, foot: `nilai ${short(bulan.reduce((s, x) => s + x.total, 0))}` })}
        ${stat({ label: "Menunggu TTD Apoteker", value: num(ttd.length), icon: "draw", tone: "purple", foot: `${SP.filter((s) => s.status === "Draft").length} draft belum dikirim` })}
        ${stat({ label: "Belum diterima", value: short(open.reduce((s, x) => s + x.total, 0)), icon: "local_shipping", tone: "info", foot: `${open.length} SP dalam pengiriman` })}
        ${stat({ label: "SP khusus", value: num(kh.length), icon: "shield", tone: "danger", foot: "narkotika · psikotropika · prekursor · OOT" })}
      </div>

      ${card({
        title: "Daftar Surat Pesanan", desc: "Cabang Pusat Fatmawati · SP khusus diarsipkan minimal 5 tahun", icon: "receipt_long", flush: true,
        tools: `<div class="input-icon" style="width:240px">${icon("search")}<input class="input sm" type="search" placeholder="Cari no. SP / PBF" aria-label="Cari SP"></div>`,
        body: `<div style="padding:14px 20px 0">${tabs("sp-tab", [{ id: "semua", label: "Semua", n: SP.length }, ...JENIS.map((j) => ({ id: j.id, label: j.id, icon: j.ic, n: SP.filter((s) => s.jenis === j.id).length }))], "semua")}</div>
          ${panel("semua", SP)}${JENIS.map((j) => panel(j.id, SP.filter((s) => s.jenis === j.id))).join("")}`,
      })}

      <div class="grid g-3">
        ${JENIS.slice(1, 4).map((j) => card({ title: `SP ${j.id}`, icon: j.ic, tone: j.tone, body: `<p class="small">${j.rule}</p>` })).join("")}
      </div>`;
    },
    mount(root) {
      on(root, "[data-sp-new]", "click", () => openSpForm());
      on(root, "[data-sp]", "click", (el) => { const sp = SP.find((s) => s.no === el.dataset.sp); openSpPreview(sp, spItems(sp)); });
      on(root, "[data-pn]", "click", (el) => { PN.no = el.dataset.pn; });
    },
  };

  /* =====================================================================
     2. PENERIMAAN BARANG
     ===================================================================== */
  const PN = { no: "SP/PST/2609/031" };
  const pnPending = () => SP.filter((s) => ["Dikirim", "Diterima Sebagian"].includes(s.status));
  const pnRows = (sp) => {
    const n = parseInt(sp.no.slice(-3), 10);
    const sup = supBy(sp.supplier);
    const code = sup.nama.split(" ")[1].slice(0, 2).toUpperCase();
    return spItems(sp).map((r, k) => ({
      ...r,
      terima: k % 7 === 3 ? Math.max(0, r.qty - 2) : r.qty,
      batch: `${code}${2600 + n * 3 + k}${String.fromCharCode(65 + (k % 4))}`,
      ed: dIso(k % 6 === 4 ? 240 + k * 3 : k === 2 ? 150 : 540 + ((n + k * 37) % 360)),
    }));
  };
  const edInfo = (edIso) => {
    const bln = daysTo(edIso) / 30.4;
    return bln < 6 ? ["row-danger", badge(`ED ${Math.max(0, Math.floor(bln))} bln · tolak`, "red", { icon: "error" })] : bln < 12 ? ["row-warn", badge(`ED ${Math.floor(bln)} bln`, "amber", { icon: "warning" })] : ["", badge("ED aman", "green", { icon: "check" })];
  };
  const qtyInfo = (q, t) => (t === q ? badge("Sesuai", "green", { icon: "check" }) : t < q ? badge(`Kurang ${q - t}`, "amber") : badge(`Lebih ${t - q}`, "purple"));

  window.PAGES.penerimaan = {
    render() {
      const pend = pnPending();
      const sp = pend.find((s) => s.no === PN.no) || pend[0];
      const sup = supBy(sp.supplier);
      const rows = pnRows(sp);
      const warnED = rows.filter((r) => daysTo(r.ed) / 30.4 < 12).length;
      const hist = [
        ["BPB/PST/2609/044", -1, "SP/PST/2609/029", "PT Bina San Prima", "BSP/INV/2609/04512", 16, 21600000, 29, "Nabila P.", "Diterima"],
        ["BPB/PST/2609/043", -2, "SP/PST/2609/030", "PT Parit Padang Global", "PPG/INV/2609/04691", 2, 2750000, 58, "apt. Rina W.", "Diterima Sebagian"],
        ["BPB/PST/2609/042", -4, "SP/PST/2609/028", "PT Anugerah Pharmindo Lestari", "APL/INV/2609/04388", 2, 1860000, 41, "apt. Rina W.", "Diterima"],
        ["BPB/PST/2609/041", -6, "SP/PST/2609/027", "PT Enseval Putera Megatrading", "EPM/INV/2609/04466", 31, 46250000, 24, "Yulia A.", "Diterima"],
        ["BPB/PST/2609/040", -8, "SP/PST/2609/026", "PT Kimia Farma Trading & Distribution", "KFTD/INV/2609/04150", 1, 1160000, 22, "apt. Rina W.", "Diterima"],
        ["BPB/PST/2609/039", -9, "SP/PST/2609/025", "PT Enseval Putera Megatrading", "EPM/INV/2609/04421", 3, 2240000, 21, "apt. Rina W.", "Ditolak"],
      ];
      const nilaiBln = hist.filter((h) => h[9] !== "Ditolak").reduce((s, h) => s + h[6], 0);
      return `
      ${UI.pageHeader({
        title: "Penerimaan Barang",
        sub: "Terima barang dari PBF berdasarkan SP & faktur — cek kesesuaian jumlah, batch, dan tanggal kedaluwarsa sebelum masuk stok.",
        crumbs: ["Pembelian", "Penerimaan Barang"],
        actions: `${btn("Scan Faktur", "white", { icon: "document_scanner", attrs: 'data-toast="Pemindai faktur siap — arahkan kamera ke QR e-Faktur" data-tone="info"' })}${btn("Excel", "teal", { icon: "table_view", attrs: 'data-toast="Riwayat penerimaan diekspor ke Excel (.xlsx)"' })}`,
      })}

      <div class="grid g-4">
        ${stat({ label: "SP menunggu penerimaan", value: num(pend.length), icon: "pending_actions", tone: "primary", foot: short(pend.reduce((s, x) => s + x.total, 0)) })}
        ${stat({ label: "Diterima 7 hari terakhir", value: num(hist.filter((h) => h[1] >= -7 && h[9] !== "Ditolak").length), icon: "inventory", tone: "success", foot: "dokumen BPB" })}
        ${stat({ label: "Item ED < 12 bulan", value: num(warnED), icon: "event_busy", tone: "warning", foot: `pada ${sp.no}` })}
        ${stat({ label: "Nilai penerimaan bulan ini", value: short(nilaiBln), icon: "payments", tone: "teal", foot: "termasuk PPN" })}
      </div>

      ${card({
        title: "Form penerimaan", desc: "Pilih SP lalu cocokkan dengan faktur & fisik barang", icon: "local_shipping", flush: true,
        tools: `${jenisBadge(sp.jenis)}${status(sp.status)}`,
        body: `
          <div class="filterbar" style="border-radius:0">
            ${select("Surat Pesanan", pend.map((s) => ({ v: s.no, l: `${s.no} · ${supShort(s.supplier)}` })), { value: sp.no, id: "pn-sp" })}
            ${input("Supplier", { value: supShort(sup.nama), attrs: "readonly" })}
            ${input("No. faktur", { value: `${sup.nama.split(" ")[1].slice(0, 3).toUpperCase()}/INV/${YM}/0${4700 + parseInt(sp.no.slice(-3), 10)}` })}
            ${input("Tgl faktur", { type: "date", value: dIso(0), id: "pn-tgl" })}
            ${input("Jatuh tempo", { type: "date", value: dIso(sup.top), id: "pn-jt", hint: `TOP ${sup.top} hari` })}
          </div>
          <div class="filterbar" style="border-radius:0">
            ${input("No. surat jalan / DO", { value: `DO-${YM}-${1180 + parseInt(sp.no.slice(-3), 10)}` })}
            ${input("No. seri e-Faktur", { value: `010.002-26.${String(81234567 + parseInt(sp.no.slice(-3), 10)).padStart(8, "0")}` })}
            ${select("Diterima oleh", ["apt. Rina Wulandari (Apoteker PJ)", "Nabila Putri (TTK)", "Yulia Anggraini (Admin Gudang)"], { value: sp.jenis === "Reguler" ? "Nabila Putri (TTK)" : "apt. Rina Wulandari (Apoteker PJ)" })}
            ${input("Suhu saat terima", { value: "24°C", hint: "Wajib untuk produk rantai dingin" })}
          </div>
          <div style="padding:14px 20px 0">${sp.jenis === "Reguler" ? alert("info", "fact_check", "Cek kesesuaian", "Cocokkan nama obat, kekuatan, bentuk sediaan, jumlah, nomor batch, dan ED antara SP, faktur, dan fisik barang. ED minimal 12 bulan; ED &lt; 6 bulan ditolak kecuali disetujui Apoteker PJ.") : alert("warn", "shield", `Penerimaan ${sp.jenis}`, "Wajib diterima & diperiksa langsung oleh Apoteker PJ, faktur ditandatangani dengan mencantumkan nama, No. SIPA, dan stempel apotek.")}</div>
          <div style="margin-top:12px" id="pn-tbl">${table({
            columns: [
              { label: "", render: (r, k) => `<input type="checkbox" class="pn-ok" data-k="${k}" ${r.terima === r.qty && daysTo(r.ed) / 30.4 >= 12 ? "checked" : ""} aria-label="Sesuai">` },
              { label: "Obat", render: (r) => `<div class="t-main">${esc(r.o.nama)}</div><div class="t-sub">${golongan(r.o.golongan)} · ${esc(r.sat)}</div>` },
              { label: "Qty SP", cls: "num nowrap", render: (r) => num(r.qty) },
              { label: "Qty diterima", cls: "num nowrap", render: (r, k) => `<input class="input sm pn-q" type="number" min="0" data-k="${k}" value="${r.terima}" style="width:76px;text-align:right" aria-label="Qty diterima">` },
              { label: "Batch", render: (r) => `<input class="input sm mono" value="${r.batch}" style="width:110px" aria-label="Batch">` },
              { label: "ED", render: (r, k) => `<input class="input sm pn-ed" type="date" data-k="${k}" value="${r.ed}" aria-label="Tanggal kedaluwarsa">` },
              { label: "Harga", cls: "num nowrap", render: (r) => `${rp(r.harga)}<div class="t-sub">disc ${r.disc}%</div>` },
              { label: "Subtotal", cls: "num nowrap", render: (r) => `<b class="pn-sub">${rp(r.terima * r.harga * (1 - r.disc / 100))}</b>` },
              { label: "Kesesuaian", render: (r) => `<div class="stack" style="gap:4px"><span class="pn-qi">${qtyInfo(r.qty, r.terima)}</span><span class="pn-ei">${edInfo(r.ed)[1]}</span></div>` },
            ],
            rows, rowCls: (r) => edInfo(r.ed)[0],
          })}</div>
          <div class="grid g-3-2" style="padding:16px 20px">
            <div class="stack">
              ${textarea("Catatan penerimaan", { value: rows.some((r) => r.terima < r.qty) ? "Sebagian item kurang kirim — PBF menjanjikan susulan dalam 3 hari kerja." : "" })}
              ${input("Lampiran faktur (foto / PDF)", { type: "file" })}
            </div>
            <div class="card" style="box-shadow:none"><div class="card-body"><dl class="kv" style="margin:0">
              <dt>Subtotal</dt><dd id="pn-t-sub"></dd><dt>Diskon PBF</dt><dd id="pn-t-disc"></dd><dt>DPP</dt><dd id="pn-t-dpp"></dd><dt>PPN 11%</dt><dd id="pn-t-ppn"></dd>
              <dt style="font-weight:800;color:var(--text)">Total faktur</dt><dd id="pn-t-total" style="font-size:18px;font-weight:800;color:var(--c-primary)"></dd>
            </dl></div></div>
          </div>`,
        foot: `<span class="small muted" id="pn-note"></span><span style="flex:1"></span>
          ${btn("Tolak Item", "danger", { icon: "block", attrs: "data-pn-tolak" })}
          ${btn("Cetak Bukti Terima", "teal", { icon: "print", attrs: 'data-toast="Bukti penerimaan barang dikirim ke printer"' })}
          ${btn("Simpan Penerimaan", "success", { icon: "inventory", attrs: "data-pn-save" })}`,
      })}

      ${card({
        title: "Riwayat penerimaan", desc: "Bukti Penerimaan Barang (BPB) 10 hari terakhir", icon: "history", flush: true,
        body: table({
          columns: [
            { label: "No. BPB", render: (h) => `<span class="mono strong">${h[0]}</span><div class="t-sub">${tgl(dIso(h[1]))} · ${esc(h[8])}</div>` },
            { label: "No. SP", render: (h) => `<span class="mono small">${h[2]}</span>` },
            { label: "Supplier", render: (h) => esc(supShort(h[3])) },
            { label: "No. faktur", render: (h) => `<span class="mono small">${h[4]}</span>` },
            { label: "Item", cls: "num nowrap", render: (h) => h[5] },
            { label: "Total", cls: "num nowrap", render: (h) => `<b>${rp(h[6])}</b>` },
            { label: "Jatuh tempo", render: (h) => `${tgl(dIso(h[7] + h[1]))}<div class="t-sub">${jtBadge(h[7] + h[1])}</div>` },
            { label: "Status", render: (h) => status(h[9]) },
            { label: "", cls: "actions", render: (h) => UI.rowActions(["view", "print"], h[0]) },
          ],
          rows: hist,
        }),
      })}`;
    },
    mount(root) {
      const pend = pnPending();
      const sp = pend.find((s) => s.no === PN.no) || pend[0];
      const rows = pnRows(sp);
      const $ = (id) => root.querySelector("#" + id);
      const calc = () => {
        let sub = 0, disc = 0, warn = 0, kurang = 0;
        root.querySelectorAll("#pn-tbl tbody tr").forEach((tr, k) => {
          const r = rows[k];
          const t = Math.max(0, +tr.querySelector(".pn-q").value || 0);
          const ed = tr.querySelector(".pn-ed").value;
          const [cls, eb] = edInfo(ed || dIso(0));
          tr.className = cls;
          tr.querySelector(".pn-ei").innerHTML = eb;
          tr.querySelector(".pn-qi").innerHTML = qtyInfo(r.qty, t);
          tr.querySelector(".pn-sub").textContent = rp(t * r.harga * (1 - r.disc / 100));
          sub += t * r.harga; disc += (t * r.harga * r.disc) / 100;
          if (cls) warn++;
          if (t < r.qty) kurang++;
        });
        const dpp = sub - disc;
        $("pn-t-sub").textContent = rp(sub); $("pn-t-disc").textContent = "−" + rp(disc); $("pn-t-dpp").textContent = rp(dpp);
        $("pn-t-ppn").textContent = rp(dpp * 0.11); $("pn-t-total").textContent = rp(dpp * 1.11);
        $("pn-note").innerHTML = `${icon("info")} ${rows.length} item · ${kurang} kurang kirim · ${warn} ED &lt; 12 bulan`;
      };
      on(root, ".pn-q, .pn-ed", "input", calc);
      on(root, ".pn-ed", "change", calc);
      on(root, "#pn-sp", "change", (el) => { PN.no = el.value; window.APP.render(); });
      on(root, "#pn-tgl", "change", (el) => { const d = new Date(el.value); d.setDate(d.getDate() + supBy(sp.supplier).top); $("pn-jt").value = DB.iso(d); });
      on(root, "[data-pn-save]", "click", () => {
        const warn = root.querySelectorAll("#pn-tbl tr.row-danger").length;
        if (warn) { toast(`${warn} item ED < 6 bulan — tolak item atau minta persetujuan Apoteker PJ`, "warn"); return; }
        confirmBox({ title: "Simpan penerimaan?", icon: "inventory", okLabel: "Simpan & Tambah Stok", okVariant: "success", msg: `Stok bertambah sesuai qty diterima per batch, faktur tercatat sebagai hutang ke <b>${esc(sp.supplier)}</b> dan status SP diperbarui.`, onOk: () => toast(`Penerimaan ${sp.no} disimpan · BPB/PST/${YM}/045`) });
      });
      on(root, "[data-pn-tolak]", "click", () => modal.open({
        title: "Tolak Item Penerimaan", icon: "block", size: "sm",
        body: `${select("Item", rows.map((r) => `${r.o.nama} · ${r.batch}`), { value: `${rows[Math.min(2, rows.length - 1)].o.nama} · ${rows[Math.min(2, rows.length - 1)].batch}` })}
          ${select("Alasan penolakan", ["ED kurang dari 6 bulan", "Kemasan rusak / segel terbuka", "Tidak sesuai SP (salah item / kekuatan)", "Suhu rantai dingin tidak terjaga", "Nomor batch berbeda dengan faktur"])}
          ${input("Qty ditolak", { type: "number", value: 2 })}
          ${textarea("Keterangan", { value: "Dikembalikan bersama kurir, PBF diminta menerbitkan nota kredit." })}`,
        foot: `${btn("Batal", "light", { attrs: "data-close" })}${btn("Tolak Item", "danger", { icon: "block", attrs: 'data-close data-toast="Item ditolak & nota retur dibuat" data-tone="danger"' })}`,
      }));
      calc();
    },
  };

  /* =====================================================================
     3. RETUR PEMBELIAN

(function () {

  /* ---------- Utilitas umum ---------- */
  // PRNG deterministik (mulberry32) — tiap generator punya seed sendiri agar render berulang tetap sama
  const mk = (seed) => {
    let a = seed >>> 0;
    const r = () => {
      a = (a + 0x6d2b79f5) >>> 0;
      let t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
    r.i = (lo, hi) => Math.floor(lo + r() * (hi - lo + 1));
    r.f = (lo, hi) => lo + r() * (hi - lo);
    return r;

    return KAT.map(([, w, , dio]) => {
      const row = {};
      CAB.forEach((c) => { row[c.id] = R(hppBulan * (w / 100) * share(c.id) * (dio / 30) * r.f(0.82, 1.22)); });
      return row;
    });
  })();
  const stokCab = (id) => sum(STOK, (row) => row[id]);

  // Kedaluwarsa per cabang per bulan
  const ED = CAB.map((c, i) => {
    const r = mk(1200 + i);
    return DB.bulanan.map(() => {
      const nilai = R(c.omzet * r.f(0.0012, 0.0046));
      const diajukan = R(nilai * r.f(0.6, 0.8));
      const disetujui = R(diajukan * r.f(0.55, 0.85));
      const musnah = nilai - diajukan;
      const ditolak = diajukan - disetujui;
      return { batch: r.i(3, 14), nilai, diajukan, disetujui, ditolak, musnah, rugi: musnah + ditolak };
    });
  });

  // Estimasi qty terjual per bulan (semua cabang) per item — dipakai laporan penjualan & persediaan
  const DEAD = ["OB0028", "OB0030", "OB0042"];
  const QTY = DB.obat.map((o, i) => {
    const r = mk(600 + i);
    if (DEAD.includes(o.kode)) return 0;
    const h = o.hargaJual;
    return h <= 10000 ? r.i(900, 2400) : h <= 30000 ? r.i(300, 1100) : h <= 100000 ? r.i(90, 420) : r.i(12, 40);
  });

  const SUPPLIER_W = [26.4, 31.2, 21.8, 11.3, 9.3]; // porsi pembelian per PBF (urutan DB.supplier)

  /* =====================================================================
     1. LAPORAN PENJUALAN
     ===================================================================== */
  const JAM_W = [2.1, 4.6, 7.4, 8.2, 7.1, 6.0, 5.4, 5.2, 5.6, 6.3, 7.9, 8.8, 8.1, 6.4, 4.8, 3.4, 2.7]; // 07.00–23.00
  const JAM_B = [0.85, 0.9, 1, 1.05, 1.02, 0.98, 0.95, 0.94, 0.97, 1, 1.06, 1.1, 1.12, 1.08, 1, 0.92, 0.88];
  // [metode, % trx, % nominal, MDR %]
  const BAYAR = [["Tunai", 41.2, 36.4, 0], ["QRIS", 33.5, 30.8, 0.3], ["Kartu Debit", 14.8, 17.6, 0.15], ["Kartu Kredit", 5.9, 8.9, 1.8], ["Transfer / Tempo", 4.6, 6.3, 0]];
  // [jenis, % trx, bobot diskon relatif, rasio HPP, warna badge]
  const JENIS = [["Umum (swamedikasi)", 71.5, 1.15, 0.69, "gray"], ["Resep dokter", 18.2, 0.55, 0.64, "blue"], ["Racikan", 4.9, 0.35, 0.58, "purple"], ["B2B (klinik & praktik)", 1.1, 2.0, 0.82, "teal"], ["BPJS PRB", 4.3, 0, 0.86, "green"]];

  function modelPenjualan(st) {
    const f = share(st.cabang);
    const r = mk(311);
    const hari = DB.harian.map((h) => {
      const umum = R(h.umum * f);
      const resepAll = R(h.resep * f);
      const racikan = R(resepAll * r.f(0.18, 0.25));
      const resep = resepAll - racikan;
      const bruto = umum + resep + racikan;
      const diskon = R(bruto * r.f(0.017, 0.026));
      const retur = R(bruto * r.f(0.003, 0.009));
      const netto = bruto - diskon - retur;
      const hpp = R(netto * r.f(0.662, 0.694));
      const trx = Math.max(1, R(h.trx * f));
      return { tgl: h.tgl, trx, item: R(trx * r.f(2.4, 3.0)), umum, resep, racikan, bruto, diskon, retur, netto, hpp, laba: netto - hpp };
    });
    const T = {};
    ["trx", "item", "umum", "resep", "racikan", "bruto", "diskon", "retur", "netto", "hpp", "laba"].forEach((k) => { T[k] = sum(hari, (h) => h[k]); });

    // Per kategori (HPP diskalakan agar total sama dengan HPP harian)
    let rest = T.netto;
    const katRaw = KAT.map(([nama, w, hr], i) => {
      const omzet = i === KAT.length - 1 ? rest : R(T.netto * w / 100);
      rest -= omzet;
      const items = DB.obat.filter((o) => o.kategori === nama);
      const avgHarga = div(sum(items, (o) => o.hargaJual), items.length) || 20000;
      return { nama, sku: items.length, qty: R(omzet / avgHarga), omzet, hppRaw: omzet * hr };
    });
    const kScale = div(T.hpp, sum(katRaw, (x) => x.hppRaw));
    const kat = katRaw.map((x) => { const hpp = R(x.hppRaw * kScale); return { ...x, hpp, laba: x.omzet - hpp }; });

    // Per produk + kelas ABC (Pareto nilai penjualan)
    const prod = DB.obat.map((o, i) => {
      const qty = QTY[i] ? Math.max(1, R(QTY[i] * f)) : 0;
      return { o, qty, omzet: qty * o.hargaJual, hpp: qty * o.hargaBeli };
    }).sort((a, b) => b.omzet - a.omzet);
    const totP = sum(prod, (p) => p.omzet);
    let cum = 0;
    prod.forEach((p) => {
      const before = div(cum, totP);
      cum += p.omzet;
      p.abc = before < 0.8 ? "A" : before < 0.95 ? "B" : "C";
      p.laba = p.omzet - p.hpp;
      p.kontrib = div(p.omzet, T.netto) * 100;
    });

    // Metode bayar
    const bayar = BAYAR.map(([nama, pt, pn, mdr]) => {
      const nominal = R(T.netto * pn / 100);
      const biaya = R(nominal * mdr / 100);
      return { nama, trx: R(T.trx * pt / 100), nominal, mdr, biaya, bersih: nominal - biaya };
    });

    // Per jam (rata-rata per hari)
    const days = hari.length;
    const jamRaw = JAM_W.map((w, i) => ({ jam: 7 + i, trx: T.trx / days * w / 100, omzetRaw: w * JAM_B[i] }));
    const jScale = div(T.netto / days, sum(jamRaw, (j) => j.omzetRaw));
    const jam = jamRaw.map((j) => ({ ...j, omzet: j.omzetRaw * jScale }));
    const peak = [...jam].sort((a, b) => b.trx - a.trx).slice(0, 3).map((j) => j.jam);

    // Per jenis (Umum mencakup B2B; Resep mencakup BPJS PRB)
    const b2b = R(T.umum * 0.11);
    const prb = R(T.resep * 0.14);
    const brutoJenis = [T.umum - b2b, T.resep - prb, T.racikan, b2b, prb];
    const dRaw = brutoJenis.map((b, i) => b * JENIS[i][2]);
    const rRaw = brutoJenis.map((b) => b);
    const jenisRows = JENIS.map(([nama, pt, , hr, tone], i) => {
      const bruto = brutoJenis[i];
      const diskon = R(T.diskon * div(dRaw[i], sum(dRaw)));
      const retur = R(T.retur * div(rRaw[i], sum(rRaw)));
      const netto = bruto - diskon - retur;
      return { nama, tone, trx: R(T.trx * pt / 100), bruto, diskon, retur, netto, hppRaw: netto * hr };
    });
    const jhScale = div(T.hpp, sum(jenisRows, (j) => j.hppRaw));
    jenisRows.forEach((j) => { j.hpp = R(j.hppRaw * jhScale); j.laba = j.netto - j.hpp; });

    return { f, hari, T, kat, prod, bayar, jam, peak, jenis: jenisRows, days };

  // Sumber: jurnal (window.GL) — konsisten dengan neraca saldo, buku besar & neraca
  function lrKons(n) {
    const cols = CAB.map((c) => {

    });
    const tot = sum(cols, (c) => c.internal);
    const elim = {};
    LR_KEYS.forEach((k) => { elim[k] = 0; });
    elim.bruto = -tot; elim.bersih = -tot; elim.hpp = -tot;
    const kons = {};
    LR_KEYS.forEach((k) => { kons[k] = sum(cols, (c) => c[k]) + elim[k]; });
    return { cols, elim, kons, internal: tot };
  }

     5. LABA RUGI (entitas tunggal: cabang aktif atau gabungan)
     ===================================================================== */
  const BEBAN = [["gaji", "Gaji & tunjangan karyawan", 0.5], ["sewa", "Sewa gedung", 0.17], ["listrik", "Listrik, air & internet", 0.07], ["susut", "Penyusutan aset tetap", 0.06], ["promo", "Pemasaran & promosi", 0.06], ["bank", "Administrasi bank & MDR", 0.06], ["lain", "Beban operasional lain", 0.08]];
  // Sumber: jurnal (window.GL). m = indeks DB.bulanan (LAST = bulan berjalan s.d. hari ini)
  function lrBulan(st, m) {
    return GL.labaRugi(st.cabang, 1, m - LAST);
  }
  const LR1 = [
    { g: "Pendapatan" },
    { k: "bruto", l: "Penjualan bruto" }, { k: "diskon", l: "Diskon penjualan", neg: 1 }, { k: "retur", l: "Retur penjualan", neg: 1 },
    { k: "bersih", l: "Penjualan bersih", sub: 1 },
    { g: "Beban pokok penjualan" },
    { k: "hpp", l: "Harga pokok penjualan (HPP)", neg: 1 }, { k: "lk", l: "Laba kotor", sub: 1 },
    { g: "Beban usaha" },
    ...BEBAN.map(([k, l]) => ({ k, l, neg: 1 })),
    { k: "beban", l: "Total beban usaha", sub: 1, neg: 1 }, { k: "lo", l: "Laba operasional", sub: 1 },
    { g: "Pendapatan (beban) lain-lain" },
    { k: "rebate", l: "Rebate & bonus PBF" }, { k: "bunga", l: "Pendapatan bunga / jasa giro" }, { k: "bBunga", l: "Beban bunga pinjaman", neg: 1 },
    { k: "lsp", l: "Laba sebelum pajak", sub: 1 }, { k: "pajak", l: "PPh Badan 22%", neg: 1 },
    { k: "lb", l: "Laba bersih", foot: 1 },
  ];

  window.PAGES["lap-labarugi"] = {
    render({ state }) {
      const cur = lrBulan(state, LAST);
      const prev = lrBulan(state, LAST - 1);
      const lain = cur.rebate + cur.bunga - cur.bBunga;
      const wf = [
        ["Penjualan bersih", 0, cur.bersih, "tot"], ["HPP", cur.lk, cur.bersih, "dec"], ["Laba kotor", 0, cur.lk, "tot"],
        ["Beban usaha", cur.lo, cur.lk, "dec"], ["Laba operasional", 0, cur.lo, "tot"],
        ["Lain-lain (neto)", Math.min(cur.lo, cur.lsp), Math.max(cur.lo, cur.lsp), lain >= 0 ? "inc" : "dec"],
        ["Pajak", cur.lb, cur.lsp, "dec"], ["Laba bersih", 0, cur.lb, "tot"],
      ];
      const row = (d) => {
        const s = d.neg ? -1 : 1;
        const a = s * cur[d.k], b = s * prev[d.k];
        const dlt = chg(cur[d.k], prev[d.k]);
        const cls = d.sub || d.foot ? "strong" : "";
        return `<tr><td class="${cls}" style="${d.sub || d.foot ? "" : "padding-left:28px"}">${d.l}</td>
          <td class="num ${cls}">${acc(a)}</td><td class="num muted">${pct(div(cur[d.k], cur.bersih) * 100)}</td>
          <td class="num ${cls}">${acc(b)}</td><td class="num muted">${pct(div(prev[d.k], prev.bersih) * 100)}</td>
          <td class="num">${acc(a - b)}</td><td class="num">${deltaBadge(dlt, !d.neg)}</td></tr>`;
      };
      const body = LR1.filter((d) => !d.foot).map((d) => (d.g ? `<tr class="group"><td colspan="7">${d.g}</td></tr>` : row(d))).join("");
      const foot = LR1.filter((d) => d.foot).map(row).join("");

      return `
      ${header("Laba Rugi", `Laporan laba rugi <b>${esc(state.cabang === "ALL" ? "gabungan semua cabang (setelah eliminasi)" : scopeName(state))}</b> · ${NAMA_BULAN[M0]} ${Y} (s.d. ${tgl(DB.TODAY)}) dibanding bulan lalu. Disusun dari jurnal umum & neraca saldo.`)}
      ${fbar(select("Bandingkan dengan", ["Bulan lalu", "Bulan yang sama tahun lalu", "Anggaran (budget)"]))}

      <div class="grid g-4">
        ${stat({ label: "Penjualan bersih", value: short(cur.bersih), icon: "payments", tone: "primary", ...heroDelta(chg(cur.bersih, prev.bersih)), hero: true })}
        ${stat({ label: "Laba kotor", value: short(cur.lk), icon: "savings", tone: "teal", delta: chg(cur.lk, prev.lk), foot: `margin ${pct(div(cur.lk, cur.bersih) * 100)}` })}
        ${stat({ label: "Laba operasional", value: short(cur.lo), icon: "trending_up", tone: "info", delta: chg(cur.lo, prev.lo), foot: `margin ${pct(div(cur.lo, cur.bersih) * 100)}` })}
        ${stat({ label: "Laba bersih", value: short(cur.lb), icon: "account_balance", tone: "success", delta: chg(cur.lb, prev.lb), foot: `margin bersih ${pct(div(cur.lb, cur.bersih) * 100)}` })}
      </div>

      ${card({
          title: "Laporan laba rugi", desc: `${BULAN[LAST]} vs ${BULAN[LAST - 1]} · % terhadap penjualan bersih`, icon: "balance", flush: true,
          body: `<div class="table-wrap"><table class="tbl compact">
            <thead><tr><th>Keterangan <span class="t-sub">(Rp ribuan)</span></th><th class="num">Bulan ini</th><th class="num">%</th><th class="num">Bulan lalu</th><th class="num">%</th><th class="num">Selisih</th><th class="num">Perubahan</th></tr></thead>
            <tbody>${body}</tbody><tfoot>${foot}</tfoot></table></div>`,
          foot: `<span class="small muted">${icon("info")} Bulan ini = bulan berjalan s.d. hari ini. PPh Badan tarif umum 22% (estimasi, sebelum koreksi fiskal). Angka dalam kurung adalah pengurang.</span><span class="spacer"></span>${btn("Jurnal Umum", "info", { size: "sm", icon: "edit_note", attrs: 'data-go="jurnal"' })}${btn("Neraca Saldo", "purple", { size: "sm", icon: "balance", attrs: 'data-go="neracasaldo"' })}${btn("Neraca", "primary", { size: "sm", icon: "account_balance", attrs: 'data-go="neraca"' })}`,
        })}
      <div class="grid g-3-2">
          ${card({
            title: "Dari pendapatan ke laba bersih", desc: "Grafik air terjun bulan ini, dalam rupiah", icon: "waterfall_chart",
            body: `${legend([["Subtotal", "var(--chart-1)"], ["Pengurang", "var(--chart-2)"], ["Penambah", "var(--chart-3)"]])}
              ${chart("llr-ch-waterfall", (k) => ({
                type: "bar",
                data: { labels: wf.map((w) => w[0]), datasets: [{ label: "Nilai", data: wf.map((w) => [w[1], w[2]]), backgroundColor: wf.map((w) => ({ tot: k.c1, dec: k.c2, inc: k.c3 }[w[3]])), ...BAR }] },
                options: { scales: { y: axRp(k), x: axCat({ ticks: { autoSkip: false, maxRotation: 45, minRotation: 0 } }) }, plugins: { tooltip: { callbacks: { label: (c) => { const w = wf[c.dataIndex]; return ` ${w[3] === "dec" ? "−" : w[3] === "inc" ? "+" : ""}${rp(Math.abs(w[2] - w[1]))}`; } } } } },
              }), "lg")}`,
          })}
          ${card({
            title: "Komposisi beban usaha", desc: `Total ${short(cur.beban)} · ${pct(div(cur.beban, cur.bersih) * 100)} dari penjualan`, icon: "pie_chart", tone: "amber",
            body: `<div class="stack">${BEBAN.map(([k, l]) => `<div class="stack" style="gap:6px"><div class="row between"><span class="small strong">${l}</span><span class="small num">${short(cur[k])} · ${pct(div(cur[k], cur.beban) * 100)}</span></div>${progress(cur[k], cur.beban)}</div>`).join("")}</div>`,
          })}
      </div>`;
    },
    mount(root) { bindCommon(root); },
  };

  /* =====================================================================
     6. LAPORAN PERSEDIAAN
     ===================================================================== */
  const SKU_AKTIF = { ALL: 3412, PST: 3184, BKS: 2610, DPK: 2395, TGR: 2472, BGR: 1980 };
  const VEN_OVERRIDE = { OB0016: "V", OB0034: "V", OB0033: "N", OB0032: "N" };
  const VEN_LABEL = { V: "Vital", E: "Esensial", N: "Non-esensial" };
  const prioritas = (abc, ven) => (abc === "A" || ven === "V" ? "I" : abc === "C" && ven === "N" ? "III" : "II");
  const PRIO_TONE = { I: "red", II: "amber", III: "gray" };

  function modelStok(st) {
    const cabs = scopeCabs(st);
    const f = share(st.cabang);
    const hpp12 = sum(DB.bulanan, (b) => b.hpp) * f;
    const kat = KAT.map(([nama, w, , dioBase, ven], i) => {
      const nilai = sum(cabs, (c) => STOK[i][c.id]);
      const hppTahun = R(hpp12 * w / 100);
      const to = div(hppTahun, nilai);
      const target = dioBase < 50 ? 45 : dioBase < 75 ? 60 : 90;
      return { nama, i, ven, nilai, hppTahun, to, dio: div(365, to), target };
    });
    const items = DB.obat.map((o, i) => {
      const r = mk(3100 + i);
      const stok = sum(cabs, (c) => o.stok[c.id] || 0);
      const qty90 = QTY[i] ? Math.max(1, R(QTY[i] * 3 * f)) : 0;
      const avg = qty90 / 90;
      const cover = avg ? stok / avg : Infinity;
      const last = qty90 ? (cover < 30 ? 0 : r.i(1, 9)) : r.i(96, 170);
      const ven = VEN_OVERRIDE[o.kode] || (KAT.find((x) => x[0] === o.kategori) || [])[4] || "E";
      return { o, stok, qty90, avg, cover, last, nilai: stok * o.hargaBeli, usage: qty90 * 4 * o.hargaBeli, ven };
    });
    const totU = sum(items, (x) => x.usage);
    let cum = 0;
    [...items].sort((a, b) => b.usage - a.usage).forEach((x) => { const before = div(cum, totU); cum += x.usage; x.abc = before < 0.8 ? "A" : before < 0.95 ? "B" : "C"; x.prio = prioritas(x.abc, x.ven); });
    const moving = items.filter((x) => x.qty90 > 0).sort((a, b) => a.cover - b.cover);
    return {
      cabs, kat, items, nilai: sum(kat, (k) => k.nilai), hppTahun: sum(kat, (k) => k.hppTahun),
      fast: moving.slice(0, 10), slow: moving.slice(-10).reverse(), dead: items.filter((x) => x.qty90 === 0),
    };
  }
  const coverTxt = (x) => (x.cover === Infinity ? dash : `${num(x.cover)} hari`);
  const moveTable = (list, kind) => table({
    columns: [
      { label: "Obat", render: (x) => `<div class="t-main">${esc(x.o.nama)}</div><div class="t-sub">${x.o.kode} · ${esc(x.o.kategori)}</div>` },
      { label: "Golongan", render: (x) => UI.golongan(x.o.golongan) },
      { label: "Stok", cls: "num", render: (x) => `${num(x.stok)} <span class="t-sub">${esc(x.o.satuan)}</span>` },
      { label: "Terjual 90 hari", cls: "num", render: (x) => num(x.qty90) },
      { label: "Rata-rata/hari", cls: "num", render: (x) => dec1(x.avg) },
      { label: "Days cover", cls: "num", render: (x) => coverTxt(x) },
      { label: "Terakhir terjual", render: (x) => (x.last === 0 ? "Hari ini" : `${x.last} hari lalu`) },
      { label: "Nilai stok", cls: "num", render: (x) => num(x.nilai) },
      { label: "Rekomendasi", render: (x) => (kind === "fast"
        ? (x.stok === 0 ? badge("Habis · segera SP", "red", { dot: true }) : x.cover < 14 ? badge("Tambah SP", "amber", { dot: true }) : badge("Stok aman", "green", { dot: true }))
        : kind === "slow" ? (x.cover > 180 ? badge("Mutasi ke cabang lain", "purple", { dot: true }) : badge("Kurangi pesanan", "amber", { dot: true }))
          : badge("Retur PBF / promo bundling", "red", { dot: true })) },
    ],
    rows: list,
    foot: tr([{ v: `${list.length} item`, span: 2 }, num(sum(list, (x) => x.stok)), num(sum(list, (x) => x.qty90)), dec1(sum(list, (x) => x.avg)), "", { v: "" }, num(sum(list, (x) => x.nilai)), { v: "" }]),
  });

  window.PAGES["lap-stok"] = {
    render({ state }) {
      const M = modelStok(state);
      const to = div(M.hppTahun, M.nilai);
      const dio = div(365, to);
      const nearED = DB.batches.filter((b) => b.sisaHari >= 0 && b.sisaHari <= 90 && M.cabs.some((c) => c.id === b.cabang));
      const katSorted = [...M.kat].sort((a, b) => b.nilai - a.nilai);
      const matrix = ["A", "B", "C"].map((a) => ({ a, cells: ["V", "E", "N"].map((v) => { const l = M.items.filter((x) => x.abc === a && x.ven === v); return { v, n: l.length, nilai: sum(l, (x) => x.nilai), p: prioritas(a, v) }; }) }));
      const deadVal = R(M.nilai * 0.036);
      const allCab = CAB.map((c) => ({ ...c, nilai: stokCab(c.id) }));

      return `
      ${header("Laporan Persediaan", `Nilai persediaan (harga pokok) <b>${esc(scopeName(state))}</b> per ${tgl(DB.TODAY)} · analisis pergerakan, perputaran, dan ABC-VEN`)}
      ${fbar(`${select("Kategori", ["Semua kategori", ...DB.kategori])}${select("Golongan", ["Semua golongan", ...Object.values(DB.golonganLabel)])}`)}

      <div class="grid g-3">
        ${stat({ label: "Nilai persediaan", value: short(M.nilai), icon: "warehouse", tone: "primary", delta: 2.4, foot: "vs akhir bulan lalu", hero: true })}
        ${stat({ label: "SKU aktif", value: num(SKU_AKTIF[state.cabang] || SKU_AKTIF.ALL), icon: "medication", tone: "info", foot: `${KAT.length} kategori` })}
        ${stat({ label: "Perputaran persediaan", value: `${dec1(to)}×/tahun`, icon: "autorenew", tone: "success", foot: "HPP 12 bulan ÷ nilai persediaan" })}
        ${stat({ label: "Days inventory (DIO)", value: `${num(dio)} hari`, icon: "hourglass_top", tone: dio > 60 ? "warning" : "teal", foot: "target grup ≤ 60 hari" })}
        ${stat({ label: "Dead stock (≥ 90 hari)", value: short(deadVal), icon: "block", tone: "danger", foot: `${pct(div(deadVal, M.nilai) * 100)} dari persediaan` })}
        ${stat({ label: "Batch ED ≤ 90 hari", value: `${nearED.length} batch`, icon: "event_busy", tone: "pink", foot: `nilai ${short(sum(nearED, (b) => b.qty * b.hargaBeli))} · prioritaskan FEFO` })}
      </div>

      ${tabs("lst", [
        { id: "nilai", label: "Nilai Persediaan", icon: "warehouse" }, { id: "gerak", label: "Fast / Slow / Dead", icon: "speed" },
        { id: "turnover", label: "Turnover & DIO", icon: "autorenew" }, { id: "abcven", label: "Matriks ABC-VEN", icon: "grid_view" },
      ], "nilai")}

      ${panel("lst", "nilai", `
        <div class="grid g-1-2">
          ${card({
            title: "Nilai persediaan per cabang", desc: "Seluruh cabang, harga pokok", icon: "store",
            body: chart("lst-ch-cabang", (k) => ({
              type: "bar",
              data: { labels: allCab.map((c) => cabShort(c.id)), datasets: [{ label: "Nilai persediaan", data: allCab.map((c) => c.nilai), backgroundColor: allCab.map((c) => cabColor(k, c.id)), ...BAR, maxBarThickness: 40 }] },
              options: { scales: { y: axRp(k), x: axCat() }, plugins: { tooltip: tipRp() } },
            }), "lg"),
          })}
          ${card({
            title: "Nilai persediaan per kategori", desc: "Ditumpuk per cabang", icon: "category", tone: "purple",
            body: `${cabLegend(M.cabs)}
              ${chart("lst-ch-kat", (k) => ({
                type: "bar",
                data: { labels: katSorted.map((x) => x.nama), datasets: M.cabs.map((c) => ({ label: cabShort(c.id), data: katSorted.map((x) => STOK[x.i][c.id]), backgroundColor: cabColor(k, c.id), ...HBAR, stack: "s", maxBarThickness: 20 })) },
                options: { indexAxis: "y", interaction: { mode: "index", intersect: false }, scales: { x: axRp(k, { stacked: true }), y: axCat({ stacked: true }) }, plugins: { tooltip: tipRp("x") } },
              }), "lg")}`,
          })}
        </div>
        ${card({
          title: "Nilai persediaan kategori × cabang", desc: "Harga pokok, dalam rupiah", icon: "table_rows", flush: true,
          body: table({
            columns: [
              { label: "Kategori", render: (x) => `<span class="strong">${esc(x.nama)}</span>` },
              ...M.cabs.map((c) => ({ label: esc(cabShort(c.id)), cls: "num", render: (x) => num(STOK[x.i][c.id]) })),
              { label: "Total", cls: "num", render: (x) => `<b>${num(x.nilai)}</b>` },
              { label: "Porsi", cls: "num", render: (x) => pct(div(x.nilai, M.nilai) * 100) },
            ],
            rows: katSorted,
            foot: tr([{ v: "Total" }, ...M.cabs.map((c) => num(sum(STOK, (row) => row[c.id]))), num(M.nilai), "100,0%"]),
          }),
        })}`, true)}

      ${panel("lst", "gerak", `
        ${alert("info", "speed", "Metode klasifikasi", " Fast moving = days cover terendah (stok habis paling cepat), slow moving = days cover tertinggi, dead stock = tidak ada penjualan ≥ 90 hari. Days cover = stok ÷ rata-rata penjualan per hari (90 hari terakhir).")}
        ${card({
          title: "Analisis pergerakan stok", desc: `${esc(scopeName(state))} · item dengan data penjualan 90 hari`, icon: "speed", flush: true,
          tools: tabs("lst-gerak", [{ id: "fast", label: "Fast moving", icon: "bolt", n: M.fast.length }, { id: "slow", label: "Slow moving", icon: "hourglass_bottom", n: M.slow.length }, { id: "dead", label: "Dead stock", icon: "block", n: M.dead.length }], "fast"),
          body: `${panel("lst-gerak", "fast", moveTable(M.fast, "fast"), true)}${panel("lst-gerak", "slow", moveTable(M.slow, "slow"))}${panel("lst-gerak", "dead", moveTable(M.dead, "dead"))}`,
        })}`)}

      ${panel("lst", "turnover", `
        <div class="grid g-2">
          ${card({
            title: "Days inventory per kategori", desc: "Hari persediaan aktual vs target", icon: "hourglass_top", tone: "cyan",
            body: `${legend([["DIO aktual", "var(--chart-1)"], ["Target DIO", TARGET_CSS]])}
              ${chart("lst-ch-dio", (k) => ({
                type: "bar",
                data: { labels: M.kat.map((x) => x.nama), datasets: [
                  { label: "DIO aktual", data: M.kat.map((x) => R(x.dio)), backgroundColor: k.c1, ...HBAR, maxBarThickness: 14 },
                  { label: "Target DIO", data: M.kat.map((x) => x.target), backgroundColor: targetFill(k), ...HBAR, maxBarThickness: 14 },
                ] },
                options: { indexAxis: "y", interaction: { mode: "index", intersect: false }, scales: { x: axNum(k, { ticks: { callback: (v) => v + " hr" } }), y: axCat() }, plugins: { tooltip: { callbacks: { label: (c) => ` ${c.dataset.label}: ${num(c.parsed.x)} hari` } } } },
              }), "lg")}`,
          })}
          ${card({
            title: "Rumus & interpretasi", icon: "functions", tone: "purple",
            body: `<div class="stack">
              <dl class="kv">
                <dt>Turnover ratio</dt><dd>HPP 12 bulan ÷ nilai persediaan</dd>
                <dt>Days inventory (DIO)</dt><dd>365 ÷ turnover ratio</dd>
                <dt>Target obat cepat laku</dt><dd>≤ 45 hari</dd>
                <dt>Target vitamin, topikal, ibu & anak</dt><dd>≤ 60 hari</dd>
                <dt>Target alkes, mata & THT</dt><dd>≤ 90 hari</dd>
              </dl>
              ${alert("warn", "warning", "Perhatian", ` ${M.kat.filter((x) => x.dio > x.target * 1.2).length} kategori melebihi target DIO lebih dari 20%. Tinjau ulang parameter stok minimum/maksimum dan frekuensi SP.`)}
            </div>`,
          })}
        </div>
        ${card({
          title: "Perputaran persediaan per kategori", desc: "Nilai dalam rupiah", icon: "table_rows", flush: true,
          body: table({
            columns: [
              { label: "Kategori", render: (x) => `<span class="strong">${esc(x.nama)}</span>` },
              { label: "HPP 12 bulan", cls: "num", render: (x) => num(x.hppTahun) },
              { label: "Nilai persediaan", cls: "num", render: (x) => num(x.nilai) },
              { label: "Turnover", cls: "num", render: (x) => `${dec1(x.to)}×` },
              { label: "DIO", cls: "num", render: (x) => `<b>${num(x.dio)} hari</b>` },
              { label: "Target", cls: "num", render: (x) => `${x.target} hari` },
              { label: "Status", render: (x) => (x.dio <= x.target ? badge("Sehat", "green", { dot: true }) : x.dio <= x.target * 1.2 ? badge("Waspada", "amber", { dot: true }) : badge("Berlebih", "red", { dot: true })) },
            ],
            rows: M.kat,
            foot: tr([{ v: "Total" }, num(M.hppTahun), num(M.nilai), `${dec1(to)}×`, `${num(dio)} hari`, { v: "" }, { v: "" }]),
          }),
        })}`)}

      ${panel("lst", "abcven", `
        <div class="grid g-1-2">
          ${card({
            title: "Kriteria", icon: "rule", tone: "purple",
            body: `<div class="stack">
              <dl class="kv">
                <dt>${abcBadge("A")}</dt><dd>80% nilai pemakaian</dd>
                <dt>${abcBadge("B")}</dt><dd>15% berikutnya</dd>
                <dt>${abcBadge("C")}</dt><dd>5% sisa</dd>
                <dt>Vital (V)</dt><dd>penyelamat jiwa / penyakit kronis</dd>
                <dt>Esensial (E)</dt><dd>efektif untuk penyakit umum</dd>
                <dt>Non-esensial (N)</dt><dd>suplemen, alkes penunjang</dd>
              </dl>
              <div class="divider"></div>
              <div class="stack" style="gap:8px">
                <div class="row between">${badge("Prioritas I", "red")}<span class="small muted">AV, AE, AN, BV, CV — kontrol ketat, tidak boleh kosong</span></div>
                <div class="row between">${badge("Prioritas II", "amber")}<span class="small muted">BE, BN, CE — kontrol sedang</span></div>
                <div class="row between">${badge("Prioritas III", "gray")}<span class="small muted">CN — kontrol longgar, kandidat dihapus</span></div>
              </div>
            </div>`,
          })}
          ${card({
            title: "Matriks ABC × VEN", desc: "Jumlah item dan nilai stok per sel", icon: "grid_view", flush: true,
            body: `<div class="table-wrap"><table class="tbl">
              <thead><tr><th>Kelas ABC</th>${["V", "E", "N"].map((v) => `<th>${VEN_LABEL[v]} (${v})</th>`).join("")}<th class="num">Total</th></tr></thead>

  /* =====================================================================

  const BELI = CAB.map((c, i) => { const r = mk(4000 + i); return DB.bulanan.map((b) => R(b.hpp * share(c.id) * r.f(0.95, 1.07))); });

  const SUP_KPI = [[3.5, 96.8, 1.2], [4.2, 94.2, 1.8], [3.8, 97.5, 1.4], [2.5, 91.3, 2.6], [3.0, 93.6, 3.1]];
  const JENIS_SP = [
    ["Reguler", 93.1, 0.12, "SP biasa, ditandatangani apoteker atau TTK yang diberi wewenang"],
    ["Narkotika", 0.9, 12, "SP khusus narkotika, 1 SP untuk 1 jenis obat, TTD Apoteker PJ + SIPA, ke PBF pemegang izin khusus"],
    ["Psikotropika", 1.6, 6, "SP khusus psikotropika, boleh lebih dari 1 jenis, TTD Apoteker PJ + SIPA"],
    ["Prekursor", 2.4, 5, "SP khusus prekursor farmasi, TTD Apoteker PJ, mencantumkan nomor SIPA & SIA"],
    ["OOT", 2.0, 5, "SP khusus obat-obat tertentu (OOT), TTD Apoteker PJ, jumlah wajar sesuai kebutuhan"],

  function modelBeli(st) {
    const cabs = scopeCabs(st);
    const bulan = DB.bulanan.map((b, m) => sum(cabs, (c) => BELI[cabIdx(c.id)][m]));
    const cur = bulan[LAST];
    const sup = DB.supplier.map((s, i) => {
      const [disc, fill, lead] = SUP_KPI[i];
      const total = R(cur * SUPPLIER_W[i] / 100);
      const dpp = R(total / 1.11);
      const ppn = total - dpp;
      const diskon = R(dpp * disc / (100 - disc));
      const sp = Math.max(1, R(total / 18.5e6));
      return { ...s, total, dpp, ppn, diskon, bruto: dpp + diskon, disc, fill, lead, sp, faktur: R(sp * 1.12), retur: R(total * [0.004, 0.006, 0.003, 0.009, 0.007][i]), hutangS: R(s.hutang * share(st.cabang)) };
    });
    const jenis = JENIS_SP.map(([nama, w, avgJt, ket]) => { const nilai = R(cur * w / 100); return { nama, nilai, ket, sp: Math.max(1, R(nilai / (avgJt * 1e6 * (nama === "Reguler" ? 150 : 1)))) }; });
    return { cabs, bulan, cur, sup, jenis };
  }
  const SP_STATUS = ["Selesai", "Selesai", "Diterima Sebagian", "Dikirim", "Selesai", "Menunggu TTD Apoteker", "Selesai", "Draft"];
  const spList = (st) => {
    const r = mk(4400);
    const gen = Array.from({ length: 14 }, (_, i) => {
      const c = CAB[i % CAB.length];
      const j = r() < 0.8 ? "Reguler" : ["Psikotropika", "Prekursor", "OOT", "Narkotika"][r.i(0, 3)];
      const s = DB.supplier[j === "Narkotika" ? 0 : r.i(0, 4)];
      const d = -r.i(2, 27);
      return { no: `SP/${c.id}/${YYMM}/${String(40 - i).padStart(3, "0")}`, tgl: DB.iso(DB.addDays(d)), cabang: c.id, supplier: s.nama, jenis: j, item: j === "Reguler" ? r.i(8, 32) : r.i(1, 3), total: j === "Reguler" ? r.i(9, 48) * 1e6 + r.i(0, 99) * 1e4 : r.i(9, 45) * 1e5, status: SP_STATUS[r.i(0, SP_STATUS.length - 1)] };
    });
    return [...DB.po.map((p) => ({ ...p, cabang: "PST" })), ...gen].filter((p) => st.cabang === "ALL" || p.cabang === st.cabang).sort((a, b) => b.tgl.localeCompare(a.tgl));
  };
  const jenisTone = { Reguler: "gray", Narkotika: "red", Psikotropika: "purple", Prekursor: "amber", OOT: "cyan" };

      const T = { total: sum(M.sup, (s) => s.total), dpp: sum(M.sup, (s) => s.dpp), ppn: sum(M.sup, (s) => s.ppn), diskon: sum(M.sup, (s) => s.diskon), bruto: sum(M.sup, (s) => s.bruto), sp: sum(M.sup, (s) => s.sp), faktur: sum(M.sup, (s) => s.faktur), retur: sum(M.sup, (s) => s.retur), hutang: sum(M.sup, (s) => s.hutangS) };
      const wAvg = (k) => div(sum(M.sup, (s) => s[k] * s.total), T.total);

      ${fbar(`${select("Supplier / PBF", ["Semua PBF", ...DB.supplier.map((s) => s.nama)])}${select("Jenis SP", ["Semua jenis", ...JENIS_SP.map((j) => j[0])])}`)}

      <div class="grid g-3">
        ${stat({ label: "Total pembelian", value: short(T.total), icon: "shopping_bag", tone: "primary", ...heroDelta(chg(M.cur, M.bulan[LAST - 1])), hero: true })}

        ${stat({ label: "Hutang PBF berjalan", value: short(T.hutang), icon: "request_quote", tone: "warning", foot: `${DB.supplier.length} PBF · lihat modul Hutang` })}

              { label: "Fill rate", cls: "num", render: (s) => (s.fill >= 95 ? badge(pct(s.fill), "green") : badge(pct(s.fill), "amber")) },
              { label: "Lead time", cls: "num nowrap", render: (s) => `${dec1(s.lead)} hari` },

              { label: "Hutang", cls: "num", render: (s) => num(s.hutangS) },

      ${panel("lpb", "bulan", `

              options: { interaction: { mode: "index", intersect: false }, scales: { y: axRp(k, { stacked: true }), x: axCat({ stacked: true }) }, plugins: { tooltip: tipRp() } },
            }), "lg")}`, true)}
            ${panel("lpb-view", "tabel", table({
              cls: "compact",
              columns: [
                { label: "Bulan", render: (r) => `<b>${r.b}</b>` },
                ...M.cabs.map((c) => ({ label: esc(cabShort(c.id)), cls: "num", render: (r) => num(BELI[cabIdx(c.id)][r.m]) })),
                { label: "Total", cls: "num", render: (r) => `<b>${num(M.bulan[r.m])}</b>` },
                { label: "Perubahan", cls: "num", render: (r) => (r.m ? deltaBadge(chg(M.bulan[r.m], M.bulan[r.m - 1]), false) : dash) },
              ],
              rows: BULAN.map((b, m) => ({ b, m })).reverse(),
              foot: tr([{ v: "Total 12 bulan" }, ...M.cabs.map((c) => num(sum(BELI[cabIdx(c.id)]))), num(sum(M.bulan)), { v: "" }]),
            }))}`,
        })}`)}

      ${panel("lpb", "jenis", `
        <div class="grid g-1-2">
          ${card({

        }),
      }))}`;
    },

  /* =====================================================================
     8. LAPORAN KEDALUWARSA

  const edHistory = () => {
    const r = mk(5100);
    const pool = DB.obat.filter((o) => !["Alat Kesehatan"].includes(o.kategori));
    return Array.from({ length: 16 }, (_, i) => {
      const o = pool[r.i(0, pool.length - 1)];
      const c = CAB[r.i(0, CAB.length - 1)];
      const d = -r.i(6, 320);
      const retur = r() < 0.62 && !["narkotika", "psikotropika"].includes(o.golongan);
      const st = retur ? ["Disetujui", "Disetujui", "Ditolak", "Diproses"][r.i(0, 3)] : "Selesai";
      const qty = r.i(3, 40);
      const nilai = qty * o.hargaBeli;
      const dt = DB.addDays(d);
      const yymm = String(dt.getFullYear()).slice(2) + String(dt.getMonth() + 1).padStart(2, "0");
      return {
        tgl: DB.iso(dt), no: retur ? `RTB/${c.id}/${yymm}/${String(r.i(1, 40)).padStart(3, "0")}` : `BA-PMS/${c.id}/${yymm}/${String(r.i(1, 9)).padStart(3, "0")}`,
        o, cabang: c.id, batch: `${o.pabrik.slice(0, 2).toUpperCase()}${r.i(2100, 2399)}${String.fromCharCode(65 + r.i(0, 2))}`, ed: DB.iso(DB.addDays(d - r.i(5, 40))),
        qty, nilai, tindakan: retur ? "Retur PBF" : "Pemusnahan", status: st, kembali: st === "Disetujui" ? nilai : 0,
        pbf: retur ? DB.supplier[r.i(0, 4)].nama : "—",
      };
    });
  };
  const PBF_REC = [68, 54, 72, 41, 58]; // tingkat persetujuan retur ED per PBF (%)
  const PBF_PROSES = [14, 21, 12, 35, 18];

  window.PAGES["lap-kadaluarsa"] = {
    render({ state }) {
      const cabs = scopeCabs(state);
      const edRows = cabs.map((c) => { const i = cabIdx(c.id); const a = {}; ["batch", "nilai", "diajukan", "disetujui", "ditolak", "musnah", "rugi"].forEach((k) => { a[k] = sum(ED[i], (m) => m[k]); }); return { c, i, ...a, omzet12: sum(CAB_BULAN[i]) }; });
      const T = {};
      ["batch", "nilai", "diajukan", "disetujui", "ditolak", "musnah", "rugi", "omzet12"].forEach((k) => { T[k] = sum(edRows, (r) => r[k]); });
      const recBulan = DB.bulanan.map((b, m) => div(sum(cabs, (c) => ED[cabIdx(c.id)][m].disetujui), sum(cabs, (c) => ED[cabIdx(c.id)][m].nilai)) * 100);
      const inScope = (id) => cabs.some((c) => c.id === id);
      const expired = DB.batches.filter((b) => b.sisaHari < 0 && inScope(b.cabang));
      const near = DB.batches.filter((b) => b.sisaHari >= 0 && b.sisaHari <= 90 && inScope(b.cabang));
      const cur = expired.map((b) => ({ tgl: DB.iso(DB.TODAY), no: "—", o: DB.obat.find((o) => o.kode === b.kode), cabang: b.cabang, batch: b.batch, ed: b.ed, qty: b.qty, nilai: b.qty * b.hargaBeli, tindakan: "Karantina", status: "Kedaluwarsa", kembali: 0, pbf: b.supplier }));
      const list = [...cur, ...edHistory().filter((h) => inScope(h.cabang)).sort((a, b) => b.tgl.localeCompare(a.tgl))];
      const pbfRaw = DB.supplier.map((s, i) => ({ s, diajukan: R(T.diajukan * SUPPLIER_W[i] / 100), rate: PBF_REC[i] }));

          title: "Kerugian bersih ED per bulan", desc: "Ditumpuk per cabang, setelah retur PBF disetujui", icon: "stacked_bar_chart", tone: "red",

            ${chart("led-ch-bulan", (k) => ({

            }))}`,

          title: "Recovery rate bulanan", desc: "Nilai retur disetujui PBF ÷ nilai ED, dalam persen", icon: "percent", tone: "green",

  const napzaMove = (item, idx, cabId) => {
    const r = mk(7000 + idx * 13 + cabIdx(cabId) * 101);
    const narko = item.golongan === "narkotika";
    const inj = item.satuan === "Ampul";
    const awal = inj ? r.i(4, 20) : r.i(40, 220);
    const masuk = Array.from({ length: r.i(0, 2) }, () => ({
      tgl: tglBulanIni(r.i(2, 24)), pbf: narko ? DB.supplier[0].nama : DB.supplier[r.i(0, 2)].nama,
      faktur: `${narko ? "KFTD" : ["KFTD", "APL", "EPM"][r.i(0, 2)]}/${YYMM}/${String(r.i(100, 999)).padStart(5, "0")}`, batch: `NZ${r.i(1000, 9999)}`, qty: inj ? 10 : 100,
    }));
    const nKeluar = r.i(2, 6);
    const keluar = Array.from({ length: nKeluar }, () => ({
      tgl: tglBulanIni(r.i(1, 27)), resep: `RSP/${cabId}/${YYMM}/${String(r.i(1, 480)).padStart(4, "0")}`,
      dokter: DB.dokter[r.i(0, DB.dokter.length - 1)].nama, pasien: PASIEN[r.i(0, PASIEN.length - 1)], qty: inj ? r.i(1, 2) : r.i(5, 30),
    }));
    const totMasuk = sum(masuk, (m) => m.qty);
    let totKeluar = sum(keluar, (k) => k.qty);
    const avail = awal + totMasuk;
    if (totKeluar > avail) { keluar.splice(1); keluar[0].qty = Math.max(0, Math.min(keluar[0].qty, avail)); totKeluar = keluar[0].qty; }
    const lain = !inj && r() < 0.15 ? Math.min(r.i(2, 10), avail - totKeluar) : 0;
    return { masuk, keluar, awal, totMasuk, totKeluar, lain, akhir: avail - totKeluar - lain };
  };

    const keluar = Math.min(awal + masuk, resep + bebas);
    return { ...it, awal, masuk, resep: Math.min(resep, keluar), bebas: keluar - Math.min(resep, keluar), akhir: awal + masuk - keluar, tolak };

              { label: "Satuan", render: (r) => esc(r.satuan) },
              { label: "Stok awal", cls: "num", render: (r) => num(r.awal) },
              { label: "Masuk", cls: "num", render: (r) => (r.masuk ? num(r.masuk) : dash) },
              { label: "Keluar resep", cls: "num", render: (r) => num(r.resep) },
              { label: "Keluar non-resep", cls: "num", render: (r) => (r.bebas ? num(r.bebas) : dash) },
              { label: "Stok akhir", cls: "num", render: (r) => `<b>${num(r.akhir)}</b>` },
              { label: "Batas/transaksi", cls: "num", render: (r) => `${r.batas} ${esc(r.satuan.toLowerCase())}` },
              { label: "Permintaan ditolak", cls: "num", render: (r) => (r.tolak ? badge(`${r.tolak}×`, r.tolak >= 5 ? "red" : "amber") : dash) },

            foot: tr([{ v: `${prek.length} item`, span: 3 }, num(sum(prek, (r) => r.awal)), num(sum(prek, (r) => r.masuk)), num(sum(prek, (r) => r.resep)), num(sum(prek, (r) => r.bebas)), num(sum(prek, (r) => r.akhir)), "", num(sum(prek, (r) => r.tolak)) + "×"]),
          }),
        })}`)}

      ${panel("lnz", "riwayat", card({
        title: "Riwayat pengiriman SIPNAP", desc: "Tanda terima elektronik disimpan minimal 3 tahun", icon: "history", flush: true,
        tools: btn("Kirim ke SIPNAP", "purple", { size: "sm", icon: "send", attrs: "data-sipnap" }),
        body: table({
          columns: [
            { label: "Periode", render: (x) => `<b>${NAMA_BULAN[x.per.getMonth()]} ${x.per.getFullYear()}</b>` },
            { label: "Cabang", render: (x) => esc(cabShort(x.c.id)) },
            { label: "Apoteker PJ", render: (x) => esc(x.c.apoteker) },
            { label: "Narkotika", cls: "num", render: (x) => `${x.n} item` },
            { label: "Psikotropika", cls: "num", render: (x) => `${x.ps} item` },
            { label: "Tanggal kirim", render: (x) => (x.kirim ? tgl(x.kirim) : dash) },
            { label: "No. tanda terima", render: (x) => `<span class="mono">${x.noTT}</span>` },
            { label: "Status", render: (x) => (!x.kirim ? statusBelum : x.late ? badge("Terkirim (terlambat)", "red", { dot: true }) : badge("Terkirim", "green", { dot: true })) },
          ],
          rows: riwayat,
          foot: tr([{ v: `${riwayat.length} laporan`, span: 3 }, `${sum(riwayat, (x) => x.n)} item`, `${sum(riwayat, (x) => x.ps)} item`, { v: `${riwayat.filter((x) => x.kirim).length} terkirim · ${riwayat.filter((x) => !x.kirim).length} belum`, span: 3 }]),
        }),
      }))}`;
    },
    mount(root, { state }) {
      bindCommon(root);
      const rows = napzaReport(state);
      root.querySelectorAll("[data-napza]").forEach((b) => b.addEventListener("click", () => napzaDetail(rows.find((r) => r.kode === b.dataset.napza), state)));
      root.querySelectorAll("[data-sipnap]").forEach((b) => b.addEventListener("click", () => UI.confirmBox({
        title: "Kirim laporan ke SIPNAP", icon: "send", okLabel: "Kirim sekarang", okVariant: "purple",
        msg: `Laporan narkotika & psikotropika <b>${esc(scopeName(state))}</b> periode <b>${NAMA_BULAN[M0]} ${Y}</b> akan dikirim ke SIPNAP atas nama Apoteker Penanggung Jawab. Pastikan stok akhir sudah sesuai dengan stok fisik.`,
        onOk: () => {
          root.querySelectorAll("[data-sipnap-status]").forEach((el) => { el.innerHTML = badge("Terkirim", "green", { dot: true }); });
          UI.toast(`Laporan SIPNAP ${NAMA_BULAN[M0]} ${Y} terkirim · tanda terima diterbitkan`, "success");
        },
      })));
    },
  };
})();

</script>
  <script>
/* Akuntansi: Chart of Account, Jurnal Umum, Kartu Buku Besar, Neraca Saldo, Neraca.
   Semua halaman membaca window.GL (assets/js/akuntansi.js) sehingga saling terintegrasi
   dengan Laba Rugi & Laporan Konsolidasi. */
(function () {
  window.PAGES = window.PAGES || {};
  const { icon, btn, card, stat, rp, num, pct, short, badge, esc, tgl, tabs, input, select, alert, modal, toast, confirmBox, chart, rpTick, areaFill, legend } = UI;

  /* ---------- helper ---------- */
  const acc = (v) => (Math.round(v) === 0 ? `<span class="muted">—</span>` : v < 0 ? `(${num(-v)})` : num(v));
  const dcell = (v) => `<td class="num">${v > 0 ? num(v) : `<span class="muted">—</span>`}</td>`;
  const dk = (v) => (Math.round(v) === 0 ? `${dcell(0)}${dcell(0)}` : v > 0 ? `${dcell(v)}${dcell(0)}` : `${dcell(0)}${dcell(-v)}`);
  const scopeLbl = (st) => (st.cabang === "ALL" ? "Gabungan semua cabang" : UI.cabangNama(st.cabang));
  const scopeCab = (st) => st.cabang || "ALL";
  const cabShort = (id) => UI.cabangNama(id).replace(/^Cabang\s+/, "");
  const TIPE_TONE = { Aset: "blue", Liabilitas: "amber", Ekuitas: "purple", Pendapatan: "green", HPP: "red", Beban: "pink", "Lain-lain": "cyan", Pajak: "gray" };
  const tipeBadge = (t) => badge(t, TIPE_TONE[t] || "gray");
  const normalBadge = (n) => badge(n === "D" ? "Debit" : "Kredit", n === "D" ? "blue" : "amber");
  const sumberBadge = (s) => badge(s, GL.SUMBER_TONE[s] || "gray");
  const cabBadge = (id) => `<span class="badge gray">${esc(id)}</span>`;
  // saldo ditampilkan menurut sisi normal akun (positif = normal)
  const normalSaldo = (a, v) => (a.normal === "D" ? v : -v);
  const akunOptions = (sel) => {
    const groups = {};
    GL.DETAIL.forEach((a) => { (groups[a.tipe] = groups[a.tipe] || []).push(a); });
    return Object.entries(groups).map(([t, list]) => `<optgroup label="${esc(t)}">${list.map((a) => `<option value="${a.kode}" ${a.kode === sel ? "selected" : ""}>${a.kode} · ${esc(a.nama)}</option>`).join("")}</optgroup>`).join("");
  };
  const toLedger = (kode) => `data-ledger="${kode}"`;
  const bindLedgerLinks = (root) => root.querySelectorAll("[data-ledger]").forEach((b) => b.addEventListener("click", () => { GL.ui.akun = b.dataset.ledger; UI.modal.close(); APP.go("bukubesar"); }));
  const periodeTxt = () => { const p = GL.periode(); return `${p.label} (1–${Number(p.to.slice(8))})`; };
  const integrasi = (active) => {
    const items = [["coa", "Chart of Account", "account_tree"], ["jurnal", "Jurnal Umum", "edit_note"], ["bukubesar", "Buku Besar", "menu_book"], ["neracasaldo", "Neraca Saldo", "balance"], ["lap-labarugi", "Laba Rugi", "trending_up"], ["neraca", "Neraca", "account_balance"], ["lap-konsolidasi", "Konsolidasi", "hub"]];
    return `<div class="card" style="padding:12px 16px"><div class="row" style="gap:6px">
      <span class="small muted strong" style="margin-right:4px">${icon("sync_alt")} Alur terintegrasi:</span>
      ${items.map(([id, l, ic], i) => `${i ? `<span class="muted">${icon("chevron_right")}</span>` : ""}<button type="button" class="chip ${id === active ? "active" : ""}" data-go="${id}">${icon(ic)}${l}</button>`).join("")}
    </div></div>`;
  };

  /* =====================================================================
     1. CHART OF ACCOUNT
     ===================================================================== */
  window.PAGES.coa = {
    render({ state }) {
      const cab = scopeCab(state);
      const tb = GL.trial(cab);
      const saldo = {};
      tb.forEach((r) => { saldo[r.kode] = r.akhir; });
      // roll-up saldo ke akun induk
      GL.COA.slice().reverse().forEach((a) => { if (a.parent) saldo[a.parent] = (saldo[a.parent] || 0) + (saldo[a.kode] || 0); });
      const det = GL.DETAIL.length;
      const tot = tb.reduce((a, r) => a + r.akhir, 0);
      const count = (t) => GL.DETAIL.filter((a) => a.tipe === t).length;

      const rows = GL.COA.map((a) => {
        const s = normalSaldo(a, saldo[a.kode] || 0);
        return `<tr data-tipe="${a.tipe}" data-q="${esc((a.kode + " " + a.nama).toLowerCase())}" class="${a.header && a.level <= 2 ? "group" : ""}">
          <td><span class="mono ${a.header ? "strong" : ""}" style="padding-left:${(a.level - 1) * 16}px">${a.kode}</span></td>
          <td class="${a.header ? "strong" : ""}" style="padding-left:${(a.level - 1) * 16 + 14}px">${a.header ? icon(a.level === 1 ? "folder" : "folder_open", "") + " " : ""}${esc(a.nama)}</td>
          <td>${a.level > 1 ? tipeBadge(a.tipe) : ""}</td>
          <td>${a.level > 1 ? `<span class="small">${a.laporan}</span>` : ""}</td>
          <td>${a.header ? badge("Header", "gray") : normalBadge(a.normal)}</td>
          <td class="num ${a.header ? "strong" : ""}">${acc(s)}</td>
          <td class="actions">${a.header ? "" : `<div class="btn-group">${btn("", "info", { icon: "menu_book", size: "sm", title: "Buka buku besar", attrs: toLedger(a.kode) })}${btn("", "warning", { icon: "edit", size: "sm", title: "Ubah akun", attrs: `data-edit-akun="${a.kode}"` })}${btn("", "danger", { icon: "block", size: "sm", title: "Nonaktifkan", attrs: `data-toast="Akun ${a.kode} tidak dapat dinonaktifkan karena masih bersaldo / dipakai pemetaan otomatis" data-tone="warn"` })}</div>`}</td>
        </tr>`;
      }).join("");

      return `
      ${UI.pageHeader({
        title: "Chart of Account (COA)",
        sub: `Bagan akun standar apotek (mengacu SAK EP) untuk ${esc(scopeLbl(state))}. Saldo per ${tgl(GL.periode().to)} dihitung langsung dari jurnal.`,
        crumbs: ["Akuntansi", "Chart of Account"],
        actions: `${btn("Tambah Akun", "success", { icon: "add", attrs: 'id="coa-add"' })}${btn("Import Excel", "teal", { icon: "upload_file", attrs: 'data-toast="Template impor COA (.xlsx) siap diunggah" data-tone="info"' })}${btn("Ekspor", "glass", { icon: "download", attrs: 'data-toast="COA diekspor ke Excel"' })}`,
      })}
      ${integrasi("coa")}
      <div class="grid g-4">
        ${stat({ label: "Akun detail (posting)", value: num(det), icon: "account_tree", tone: "primary", foot: `${GL.COA.length - det} akun header · 4 level`, hero: true })}
        ${stat({ label: "Akun neraca", value: num(count("Aset") + count("Liabilitas") + count("Ekuitas")), icon: "account_balance", tone: "info", foot: `Aset ${count("Aset")} · Liabilitas ${count("Liabilitas")} · Ekuitas ${count("Ekuitas")}` })}
        ${stat({ label: "Akun laba rugi", value: num(det - count("Aset") - count("Liabilitas") - count("Ekuitas")), icon: "trending_up", tone: "success", foot: `Pendapatan ${count("Pendapatan")} · HPP ${count("HPP")} · Beban ${count("Beban")}` })}
        ${stat({ label: "Kontrol saldo", value: Math.round(tot) === 0 ? "Seimbang" : rp(tot), icon: Math.round(tot) === 0 ? "verified" : "error", tone: Math.round(tot) === 0 ? "teal" : "danger", foot: "Σ debit − Σ kredit seluruh akun = 0" })}
      </div>
      <div>${tabs("coa-tab", [{ id: "daftar", label: "Daftar Akun", icon: "list" }, { id: "map", label: "Pemetaan Jurnal Otomatis", icon: "hub", n: GL.MAPPING.length }, { id: "struktur", label: "Struktur Kode", icon: "schema" }], "daftar")}</div>

      <div data-panel-group="coa-tab" data-panel="daftar">
        ${card({
          title: "Daftar akun", desc: "Klik ikon buku untuk membuka kartu buku besar akun", icon: "list_alt", flush: true,
          tools: `<div class="input-icon" style="min-width:200px">${icon("search")}<input id="coa-q" class="input sm" type="search" placeholder="Cari kode / nama akun" aria-label="Cari akun"></div>`,
          body: `<div style="padding:12px 20px 4px"><div class="chips" data-chip-group="coa-tipe" id="coa-tipe">${["Semua", ...Object.values(GL.TIPE)].map((t, i) => `<button type="button" class="chip ${i ? "" : "active"}" data-t="${t}">${t}</button>`).join("")}</div></div>
            <div class="table-wrap"><table class="tbl compact" id="coa-table"><thead><tr><th>Kode</th><th>Nama akun</th><th>Tipe</th><th>Laporan</th><th>Saldo normal</th><th class="num">Saldo (Rp)</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>`,
        })}
      </div>

      <div data-panel-group="coa-tab" data-panel="map" hidden>
        ${card({
          title: "Pemetaan jurnal otomatis", desc: "Setiap transaksi operasional langsung membentuk jurnal ke akun berikut (dapat diubah per cabang)", icon: "hub", tone: "purple", flush: true,
          body: UI.table({
            columns: [
              { label: "Transaksi / modul", render: (r) => `<b>${esc(r[0])}</b>` },
              { label: "Debit", render: (r) => esc(r[1]) },
              { label: "Kredit", render: (r) => esc(r[2]) },
              { label: "Kode akun (D / K)", render: (r) => `<span class="mono small">${esc(r[3])}</span>` },
              { label: "Status", render: () => badge("Otomatis", "green", { dot: true }) },
              { label: "", cls: "actions", render: (r) => btn("Buka modul", "info", { size: "sm", icon: "open_in_new", attrs: `data-go="${r[4]}"` }) },
            ],
            rows: GL.MAPPING,
          }),
          foot: `<span class="small muted">${icon("info")} Jurnal otomatis diposting real-time saat transaksi disimpan. Perubahan pemetaan hanya berlaku untuk transaksi berikutnya dan tercatat di log aktivitas.</span>`,
        })}
      </div>

      <div data-panel-group="coa-tab" data-panel="struktur" hidden>
        <div class="grid g-2">
          ${card({
            title: "Format kode akun", icon: "schema", tone: "cyan",
            body: `<div class="stack">
              <div class="mono" style="font-size:22px;font-weight:700">1 - 1 1 0 3</div>
              <dl class="kv" style="grid-template-columns:auto 1fr">
                <dt>Digit 1</dt><dd style="text-align:left">Kelompok (1 Aset … 8 Pajak)</dd>
                <dt>Digit 2</dt><dd style="text-align:left">Golongan (lancar / tidak lancar)</dd>
                <dt>Digit 3</dt><dd style="text-align:left">Sub golongan (kas, piutang, persediaan)</dd>
                <dt>Digit 4–5</dt><dd style="text-align:left">Nomor urut akun detail</dd>
              </dl>
              ${alert("info", "lightbulb", "Hanya akun detail yang bisa diposting", "Akun header menjumlahkan saldo akun di bawahnya secara otomatis.")}
            </div>`,
          })}
          ${card({
            title: "Kelompok akun", icon: "category", flush: true,
            body: UI.table({
              columns: [{ label: "Kode", render: (r) => `<span class="mono strong">${r[0]}</span>` }, { label: "Kelompok", render: (r) => tipeBadge(r[1]) }, { label: "Saldo normal", render: (r) => normalBadge(r[2]) }, { label: "Laporan", key: 3 }],
              rows: [["1", "Aset", "D", "Neraca"], ["2", "Liabilitas", "K", "Neraca"], ["3", "Ekuitas", "K", "Neraca"], ["4", "Pendapatan", "K", "Laba Rugi"], ["5", "HPP", "D", "Laba Rugi"], ["6", "Beban", "D", "Laba Rugi"], ["7", "Lain-lain", "K", "Laba Rugi"], ["8", "Pajak", "D", "Laba Rugi"]],
            }),
          })}
        </div>
      </div>`;
    },
    mount(root) {
      bindLedgerLinks(root);
      const q = root.querySelector("#coa-q");
      let tipe = "Semua";
      const apply = () => {
        const v = q.value.trim().toLowerCase();
        root.querySelectorAll("#coa-table tbody tr").forEach((tr) => {
          const okT = tipe === "Semua" || tr.dataset.tipe === tipe;
          const okQ = !v || tr.dataset.q.includes(v);
          tr.hidden = !(okT && okQ);
        });
      };
      q.addEventListener("input", apply);
      root.querySelector("#coa-tipe").addEventListener("click", (e) => { const c = e.target.closest("[data-t]"); if (c) { tipe = c.dataset.t; apply(); } });
      const openForm = (a) => {
        const heads = GL.COA.filter((x) => x.header && x.level > 1);
        modal.open({
          title: a ? `Ubah akun ${a.kode}` : "Tambah akun", icon: "account_tree",
          body: `<div class="form-grid">
            ${input("Kode akun", { value: a ? a.kode : "1-1105", hint: "Format X-XXXX, unik" })}
            ${input("Nama akun", { value: a ? a.nama : "Bank BRI - Operasional Cabang" })}
            ${select("Akun induk", heads.map((h) => ({ v: h.kode, l: `${h.kode} · ${h.nama}` })), { value: a ? a.parent : "1-1100" })}
            ${select("Saldo normal", [{ v: "D", l: "Debit" }, { v: "K", l: "Kredit" }], { value: a ? a.normal : "D" })}
            ${select("Berlaku untuk", ["Semua cabang", ...DB.cabang.map((c) => c.nama)])}
            ${input("Saldo awal", { value: "0", hint: "Diisi saat migrasi; selanjutnya saldo dari jurnal" })}
            <label class="check full"><input type="checkbox" checked> Akun aktif & dapat dipilih pada jurnal manual</label>
          </div>`,
          foot: `${btn("Batal", "light", { attrs: "data-close" })}${btn("Simpan Akun", "primary", { icon: "save", attrs: `data-toast="Akun ${a ? "diperbarui" : "ditambahkan"}" data-close` })}`,
        });
      };
      root.querySelector("#coa-add").addEventListener("click", () => openForm(null));
      root.querySelectorAll("[data-edit-akun]").forEach((b) => b.addEventListener("click", () => openForm(GL.akun(b.dataset.editAkun))));
    },
  };

  /* =====================================================================
     2. JURNAL UMUM
     ===================================================================== */
  let jFilter = { q: "", sumber: "Semua", limit: 25 };
  const journalRows = (list) => list.map((j) => j.lines.map((l, i) => {
    const a = GL.akun(l.akun);
    return `<tr class="${i === 0 ? "j-first" : ""}" ${i === 0 ? `style="border-top:2px solid var(--border-strong)"` : ""}>
      <td class="nowrap">${i === 0 ? `<b>${tgl(j.tgl)}</b>` : ""}</td>
      <td>${i === 0 ? `<button type="button" class="btn light sm" data-jv="${j.no}" style="font-family:var(--mono)">${j.no}</button><div class="t-sub">${esc(j.ref)}</div>` : ""}</td>
      <td style="padding-left:${l.k ? 34 : 14}px"><button type="button" class="mono small" ${toLedger(l.akun)} style="background:none;border:0;color:var(--c-primary-2);cursor:pointer;padding:0">${l.akun}</button> ${esc(a.nama)}</td>
      <td>${i === 0 ? `${esc(j.ket)}<div class="row" style="gap:4px;margin-top:4px">${cabBadge(j.cabang)} ${sumberBadge(j.sumber)}</div>` : ""}</td>
      ${dcell(l.d)}${dcell(l.k)}
    </tr>`;
  }).join("")).join("");

  function jurnalManual(state, preset) {
    const cab = state.cabang === "ALL" ? "PST" : state.cabang;
    const P = GL.periode();
    const lines = preset ? preset.lines.map((l) => ({ ...l })) : [{ akun: "6-1501", d: 850000, k: 0 }, { akun: "1-1101", d: 0, k: 850000 }];
    const TPL = {
      "": null,
      sewa: { ket: "Pembayaran sewa gedung 12 bulan dibayar dimuka", lines: [{ akun: "1-1403", d: 312000000, k: 0 }, { akun: "1-1103", d: 0, k: 312000000 }] },
      modal: { ket: "Setoran tambahan modal pemegang saham", lines: [{ akun: "1-1103", d: 250000000, k: 0 }, { akun: "3-1101", d: 0, k: 250000000 }] },
      aset: { ket: "Pembelian lemari pendingin vaksin (medical refrigerator)", lines: [{ akun: "1-2101", d: 38500000, k: 0 }, { akun: "1-1103", d: 0, k: 38500000 }] },
      piutang: { ket: "Penghapusan piutang klinik tak tertagih", lines: [{ akun: "6-1901", d: 2750000, k: 0 }, { akun: "1-1201", d: 0, k: 2750000 }] },
    };
    const el = modal.open({
      title: preset ? "Jurnal balik (reversal)" : "Buat jurnal manual", icon: "edit_note", size: "xl",
      body: `
        <div class="form-grid cols-4">
          ${input("Tanggal", { id: "jm-tgl", type: "date", value: P.to, attrs: `min="${P.from}" max="${P.to}"` })}

        </div>
        <div class="table-wrap"><table class="tbl compact"><thead><tr><th style="min-width:280px">Akun</th><th class="num" style="min-width:150px">Debit</th><th class="num" style="min-width:150px">Kredit</th><th></th></tr></thead>
          <tbody id="jm-lines"></tbody>

        <div id="jm-check"></div>`,
      foot: `${btn("Batal", "light", { attrs: "data-close" })}${btn("Simpan Draft", "warning", { icon: "draft", attrs: 'data-toast="Draft jurnal disimpan (belum memengaruhi saldo)" data-close' })}${btn("Posting Jurnal", "primary", { icon: "task_alt", attrs: 'id="jm-post"' })}`,
    });
    const tbody = el.querySelector("#jm-lines");
    const draw = () => {
      tbody.innerHTML = lines.map((l, i) => `<tr>
        <td><select class="select sm" data-i="${i}" data-f="akun" aria-label="Akun baris ${i + 1}">${akunOptions(l.akun)}</select></td>
        <td><input class="input sm num" data-i="${i}" data-f="d" inputmode="numeric" value="${l.d ? num(l.d) : ""}" placeholder="0" aria-label="Debit baris ${i + 1}"></td>
        <td><input class="input sm num" data-i="${i}" data-f="k" inputmode="numeric" value="${l.k ? num(l.k) : ""}" placeholder="0" aria-label="Kredit baris ${i + 1}"></td>
        <td class="actions">${btn("", "danger", { icon: "delete", size: "sm", title: "Hapus baris", attrs: `data-del="${i}"` })}</td></tr>`).join("");
      calc();
    };
    const calc = () => {
      const d = lines.reduce((a, l) => a + (+l.d || 0), 0), k = lines.reduce((a, l) => a + (+l.k || 0), 0);
      el.querySelector("#jm-td").innerHTML = `<b>${rp(d)}</b>`;
      el.querySelector("#jm-tk").innerHTML = `<b>${rp(k)}</b>`;
      const ok = d === k && d > 0;
      el.querySelector("#jm-check").innerHTML = ok
        ? alert("success", "check_circle", "Jurnal seimbang", `Total debit = total kredit = ${rp(d)}. Setelah diposting, saldo langsung masuk ke buku besar, neraca saldo, laba rugi & neraca.`)
        : alert("danger", "error", "Jurnal belum seimbang", `Selisih ${rp(Math.abs(d - k))}. Lengkapi baris debit/kredit sebelum posting.`);
      el.querySelector("#jm-post").disabled = !ok;
    };
    tbody.addEventListener("input", (e) => {
      const t = e.target.closest("[data-f]"); if (!t) return;
      const l = lines[+t.dataset.i];
      if (t.dataset.f === "akun") l.akun = t.value;
      else {
        const v = parseInt(t.value.replace(/\D/g, ""), 10) || 0;
        const other = t.dataset.f === "d" ? "k" : "d";
        l[t.dataset.f] = v; t.value = v ? num(v) : "";
        if (v && l[other]) { l[other] = 0; const o = tbody.querySelector(`[data-i="${t.dataset.i}"][data-f="${other}"]`); if (o) o.value = ""; }
      }
      calc();
    });
    tbody.addEventListener("change", (e) => { const t = e.target.closest('[data-f="akun"]'); if (t) lines[+t.dataset.i].akun = t.value; });
    tbody.addEventListener("click", (e) => { const b = e.target.closest("[data-del]"); if (b && lines.length > 2) { lines.splice(+b.dataset.del, 1); draw(); } });

    el.querySelector("#jm-tpl").addEventListener("change", (e) => {
      const t = TPL[e.target.value]; if (!t) return;

      el.querySelector("#jm-ket").value = t.ket; draw();
    });
    el.querySelector("#jm-post").addEventListener("click", () => {
      try {

        APP.render();
      } catch (err) { toast(err.message, "danger"); }
    });
    draw();
  }

          body: `<dl class="kv">

  /* =====================================================================
     4. NERACA SALDO (+ Neraca Lajur)

  window.PAGES.neracasaldo = {
    render({ state }) {
      const cab = scopeCab(state);
      const tb = GL.trial(cab).filter((r) => r.awal || r.d || r.k);
      const T = { awD: 0, awK: 0, d: 0, k: 0, akD: 0, akK: 0 };
      tb.forEach((r) => { if (r.awal > 0) T.awD += r.awal; else T.awK -= r.awal; T.d += r.d; T.k += r.k; if (r.akhir > 0) T.akD += r.akhir; else T.akK -= r.akhir; });
      const ok = Math.round(T.akD) === Math.round(T.akK);
      const groups = Object.values(GL.TIPE);
      const nsRows = groups.map((g) => {
        const rs = tb.filter((r) => r.tipe === g);
        if (!rs.length) return "";
        return `<tr class="group"><td colspan="9">${esc(g)}</td></tr>` + rs.map((r) => `<tr>
          <td><button type="button" class="mono small" ${toLedger(r.kode)} style="background:none;border:0;color:var(--c-primary-2);cursor:pointer;padding:0">${r.kode}</button></td><td>${esc(r.nama)}</td>
          ${dk(r.awal)}${dcell(r.d)}${dcell(r.k)}${dk(r.akhir)}
          <td class="actions">${btn("", "info", { icon: "menu_book", size: "sm", title: "Buku besar", attrs: toLedger(r.kode) })}</td></tr>`).join("");
      }).join("");

      // Neraca lajur
      const lr = tb.filter((r) => !GL.isNeraca(r.kode));
      const nr = tb.filter((r) => GL.isNeraca(r.kode));
      const W = { nsD: T.akD, nsK: T.akK, lrD: 0, lrK: 0, nD: 0, nK: 0 };
      lr.forEach((r) => { if (r.akhir > 0) W.lrD += r.akhir; else W.lrK -= r.akhir; });
      nr.forEach((r) => { if (r.akhir > 0) W.nD += r.akhir; else W.nK -= r.akhir; });
      const laba = W.lrK - W.lrD;

        ${keys("2-1").map((k) => line(k, V(N1, k, -1), V(N0, k, -1))).join("")}

        ${keys("2-2").map((k) => line(k, V(N1, k, -1), V(N0, k, -1))).join("")}

        actions: `${btn("Excel", "teal", { icon: "table_view", attrs: 'data-toast="Neraca diekspor ke Excel"' })}${btn("PDF", "danger", { icon: "picture_as_pdf", attrs: 'data-toast="Neraca diekspor ke PDF"' })}${btn(ALL ? "Per Cabang" : "Konsolidasi", "glass", { icon: "hub", attrs: 'data-go="lap-konsolidasi"' })}`,

        ${stat({ label: "Total liabilitas", value: short(liab1), icon: "credit_card", tone: "warning", foot: `${pct(liab1 / aset1 * 100)} dari aset` })}
        ${stat({ label: "Total ekuitas", value: short(N1.ekuitas), icon: "savings", tone: "purple", foot: `laba tahun berjalan ${short(N1.lbj)}` })}
